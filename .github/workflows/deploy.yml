name: Deploy PDA to Azure

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'public/**'
      - 'server.mjs'
      - 'package.json'
      - 'Dockerfile'
      - 'infra/**'
      - 'scripts/**'
      - '.github/workflows/deploy.yml'

permissions:
  id-token: write
  contents: read

concurrency:
  group: pda-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
      AZURE_LOCATION: ${{ vars.AZURE_LOCATION }}
      PDA_NAME_PREFIX: ${{ vars.PDA_NAME_PREFIX }}
      PDA_IMAGE_TAG: ${{ github.sha }}
      PDA_DEPLOY_OLLAMA: ${{ vars.PDA_DEPLOY_OLLAMA }}
      PDA_OLLAMA_MODEL: ${{ vars.PDA_OLLAMA_MODEL }}
      PDA_OLLAMA_PROFILE: ${{ vars.PDA_OLLAMA_PROFILE }}
      DEPLOYER_PRINCIPAL_ID: ${{ vars.DEPLOYER_PRINCIPAL_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Select subscription
        shell: pwsh
        run: ./scripts/Connect-Azure.ps1

      - name: Build and push image
        id: build
        shell: pwsh
        run: ./scripts/Build-And-PushImage.ps1

      - name: Deploy infrastructure
        id: deploy
        shell: pwsh
        env:
          PDA_WEB_IMAGE: ${{ steps.build.outputs.image }}
        run: ./scripts/Deploy-Infrastructure.ps1
